<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">ReviewTrans Studio</title>
  <desc id="desc">Hai bong bóng thoại (ngôn ngữ gốc và bản dịch) với nút phát video và hai dòng phụ đề</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82FF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- nền -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#shine)"/>

  <!-- bong bóng ngôn ngữ gốc (phía sau) -->
  <path d="M74 50H138A22 22 0 0 1 160 72V106A22 22 0 0 1 138 128H90L62 148L68 125A22 22 0 0 1 52 106V72A22 22 0 0 1 74 50Z"
        fill="#FFFFFF" fill-opacity="0.26"/>
  <rect x="68" y="68" width="42" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="68" y="85" width="26" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- bong bóng bản dịch (phía trước) + nút phát -->
  <path d="M118 86H182A24 24 0 0 1 206 110V146A24 24 0 0 1 182 170L198 192L162 170H118A24 24 0 0 1 94 146V110A24 24 0 0 1 118 86Z"
        fill="#FFFFFF"/>
  <path d="M140 111.5C140 108.4 143.4 106.5 146 108.1L170.6 124.6C172.9 126.1 172.9 129.9 170.6 131.4L146 147.9C143.4 149.5 140 147.6 140 144.5Z"
        fill="url(#bg)"/>

  <!-- dòng phụ đề -->
  <rect x="56" y="204" width="144" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="82" y="226" width="92" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.62"/>
</svg>
