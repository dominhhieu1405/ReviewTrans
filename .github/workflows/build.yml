# CI cho ReviewTrans Studio (Windows)
#
#  - Pull request        → chỉ chạy test.
#  - Merge/push vào main → test + đóng gói + TỰ TẠO RELEASE:
#        * APP_VERSION (reviewtrans/__init__.py) chưa có release → tạo release chính thức vX.Y.Z (đánh dấu Latest)
#        * đã có                                                  → cập nhật release thử nghiệm "nightly"
#    Muốn ra bản chính thức mới: tăng APP_VERSION rồi merge vào main.
#  - Push tag vX.Y.Z      → đóng gói và tạo/cập nhật release cho tag đó.
#  - Chạy tay (Run workflow) → đóng gói, file nằm ở mục Artifacts của lần chạy.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "legacy/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "legacy/**"]
  workflow_dispatch:
    inputs:
      libmpv:
        description: "Đóng gói kèm libmpv (~120 MB)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  GITHUB_TOKEN: ${{ github.token }} # tải release whisper.cpp/libmpv qua API không bị giới hạn
  GH_TOKEN: ${{ github.token }} # cho lệnh gh (tạo release)

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cài thư viện
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Cache công cụ (ffmpeg, whisper, libmpv)
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-${{ runner.os }}-v2-${{ hashFiles('scripts/build.py') }}

      - name: Gom công cụ
        run: python scripts/build.py tools --no-libmpv

      - name: Chạy test
        env:
          QT_QPA_PLATFORM: offscreen
          REVIEWTRANS_EXTRA_BIN: ${{ github.workspace }}\build\tools
        run: python -m pytest -q

  build:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cài thư viện
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Xác định phiên bản và kênh phát hành
        id: version
        run: |
          $base = python -c "import sys; sys.path.insert(0, '.'); from scripts.build import current_version; print(current_version())"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $channel = "tag"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "$base-dev.${{ github.run_number }}"
            $channel = "none"
          } else {
            gh release view "v$base" --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $version = $base
              $channel = "stable"
            } else {
              $version = "$base-dev.${{ github.run_number }}"
              $channel = "nightly"
            }
            $global:LASTEXITCODE = 0
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          Write-Host "Phiên bản: $version — kênh: $channel"

      - name: Cache công cụ (ffmpeg, whisper, libmpv)
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-${{ runner.os }}-v2-${{ hashFiles('scripts/build.py') }}

      - name: Gom công cụ
        run: |
          $flags = @()
          if ("${{ inputs.libmpv }}" -eq "false") { $flags += "--no-libmpv" }
          python scripts/build.py tools @flags

      - name: Chạy test
        env:
          QT_QPA_PLATFORM: offscreen
          REVIEWTRANS_EXTRA_BIN: ${{ github.workspace }}\build\tools
        run: python -m pytest -q

      - name: Cài Inno Setup (nếu runner chưa có)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Đóng gói
        run: |
          $flags = @("--version", "${{ steps.version.outputs.value }}", "--require-installer")
          if ("${{ inputs.libmpv }}" -eq "false") { $flags += "--no-libmpv" }
          python scripts/build.py all @flags

      - name: Tải lên Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ReviewTrans-${{ steps.version.outputs.value }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Tạo / cập nhật GitHub Release
        if: steps.version.outputs.channel != 'none'
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $channel = "${{ steps.version.outputs.channel }}"
          $files = @(Get-ChildItem release -File | Where-Object { $_.Extension -in ".exe", ".zip" } | ForEach-Object { $_.FullName })
          if ($channel -eq "nightly") {
            # một release thử nghiệm duy nhất, luôn trỏ tới commit mới nhất của main
            gh release delete nightly --cleanup-tag --yes 2>$null
            $global:LASTEXITCODE = 0
            $notes = "Bản build tự động từ commit ${{ github.sha }} trên main (phiên bản $version).`n`nĐây là bản thử nghiệm, có thể chưa ổn định. Bản chính thức: xem release có nhãn **Latest**."
            gh release create nightly @files --target "${{ github.sha }}" --prerelease --title "Bản thử nghiệm mới nhất ($version)" --notes $notes
          } else {
            $tag = "v$version"
            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @files --clobber
            } else {
              $global:LASTEXITCODE = 0
              $extra = @()
              if ($version.Contains("-")) { $extra += "--prerelease" } else { $extra += "--latest" }
              gh release create $tag @files --target "${{ github.sha }}" --title "ReviewTrans Studio $version" --generate-notes @extra
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Đã phát hành: $channel $version"
