# Build ReviewTrans Studio trên Windows: chạy test → đóng gói (installer + zip portable).
#  - Push lên main / Pull request / chạy tay: build và đính kèm file vào mục Artifacts của lần chạy.
#  - Push tag dạng v2.1.0: build rồi tạo GitHub Release kèm installer + zip.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "legacy/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "legacy/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Số phiên bản (bỏ trống = APP_VERSION trong code + số lần chạy)"
        required: false
      libmpv:
        description: "Đóng gói kèm libmpv (~120 MB)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ github.token }}  # tải release whisper.cpp/libmpv qua API không bị giới hạn
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cài thư viện
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Xác định phiên bản
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } elseif ("${{ inputs.version }}") {
            $v = "${{ inputs.version }}".TrimStart("v")
          } else {
            $base = python -c "import sys; sys.path.insert(0, '.'); from scripts.build import current_version; print(current_version())"
            $v = "$base-dev.${{ github.run_number }}"
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Phiên bản: $v"

      - name: Cache công cụ (ffmpeg, whisper, libmpv)
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-${{ runner.os }}-v2-${{ hashFiles('scripts/build.py') }}

      - name: Gom công cụ
        run: |
          $flags = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.libmpv }}" -eq "false") { $flags += "--no-libmpv" }
          python scripts/build.py tools @flags

      - name: Chạy test
        env:
          QT_QPA_PLATFORM: offscreen
          REVIEWTRANS_EXTRA_BIN: ${{ github.workspace }}\build\tools
        run: python -m pytest -q

      - name: Cài Inno Setup (nếu runner chưa có)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Đóng gói
        run: |
          $flags = @("--version", "${{ steps.version.outputs.value }}", "--require-installer")
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.libmpv }}" -eq "false") { $flags += "--no-libmpv" }
          python scripts/build.py all @flags

      - name: Tải lên Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ReviewTrans-${{ steps.version.outputs.value }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Tạo GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ReviewTrans Studio ${{ steps.version.outputs.value }}
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
